[workspace]
members = [
    "apps/api-server",
    "apps/worker",
    "crates/domain",
    "crates/auth",
    "crates/storage",
    "crates/search",
    "crates/collector",
    "crates/extractor",
    "crates/validator",
    "crates/entity_resolution",
    "crates/provenance",
    "crates/workflow",
    "crates/queue",
    "crates/exports",
    "crates/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Datavault Team"]

[workspace.dependencies]
# Async runtime
tokio          = { version = "1", features = ["full"] }
tokio-stream   = "0.1"

# Web
axum           = { version = "0.8", features = ["macros", "http2", "multipart"] }
axum-extra     = { version = "0.10", features = ["cookie", "typed-header"] }
tower          = "0.5"
tower-http     = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs", "request-id"] }
hyper          = { version = "1", features = ["full"] }

# Serialization
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"

# Database
sqlx           = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Redis / Queue
redis          = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = { version = "0.20" }

# HTTP Client
reqwest        = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"] }

# Auth / Security
argon2         = "0.5"
rand           = "0.8"
jsonwebtoken   = "9"
sha2           = "0.10"
hmac           = "0.12"
hex            = "0.4"

# Core types
uuid           = { version = "1.10", features = ["v4", "serde"] }
chrono         = { version = "0.4", features = ["serde"] }
url            = { version = "2.5", features = ["serde"] }

# Observability
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1"
anyhow    = "1"

# Utilities
dotenvy        = "0.15"
regex          = "1.10"
futures-util   = "0.3"
async-trait    = "0.1"
base64         = "0.22"
bytes          = "1"
